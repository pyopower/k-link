# k-link node: panel at /, Allmon3 at /allmon3/ (its own conf-enabled/allmon3.conf)
<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPassMatch "^/(?!allmon3(/|$))(.*)$" "http://127.0.0.1:8078/$2"
    ProxyPassReverse "/" "http://127.0.0.1:8078/"
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
