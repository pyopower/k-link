# k-link: ALSA device "klink" = the radio, for applications that use ALSA
# directly (Direwolf, SvxLink, ...). Needs pipewire-alsa.
pcm.klink {
	type asym
	playback.pcm "pipewire:NODE=klink_to_radio"
	capture.pcm "pipewire:NODE=klink_from_radio"
	hint {
		show on
		description "k-link radio (to/from the radio via PipeWire)"
	}
}
