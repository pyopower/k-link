[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k-link"
dynamic = ["version"]
description = "Radio gateway through a Bluetooth K-plug PTT adapter (USRP for AllStarLink / DVSwitch)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
k-link = "klink.cli:main"

[tool.setuptools.dynamic]
version = { attr = "klink.__version__" }
