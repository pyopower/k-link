[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; --- audio: PipeWire + WirePlumber of the container (Bluetooth through the
; host's BlueZ over the system D-Bus)
[program:dbus-session]
command=dbus-daemon --session --nofork --nopidfile --address=unix:path=/run/k-link/bus
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pipewire]
command=pipewire
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wireplumber]
command=wireplumber
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:k-link]
command=bash -c 'sleep 3; exec k-link -c /data/k-link.ini run'
priority=40
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- AllStarLink
[program:asterisk]
command=/usr/sbin/asterisk -g -f -p -U asterisk
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:allmon3]
command=bash -c 'sleep 8; exec allmon3'
user=allmon3
priority=60
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- web: Apache (panel at /, Allmon3 at /allmon3/) and the node panel
[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
priority=70
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:panel]
command=python3 /usr/lib/k-link-node/web.py
priority=80
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
